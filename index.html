<html lang="fr"><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf1ed">

var en = c.lang === "en" || (c.lang !== "fr" && !/^fr/i.test(String((navigator.languages && navigator.languages[0]) || navigator.language || "fr")));
document.write(en ? '<meta name="apple-mobile-web-app-title" content="6MWT"><link rel="manifest" href="manifest-en.webmanifest"><link rel="apple-touch-icon" href="icon-en-180.png">'
  : '<meta name="apple-mobile-web-app-title" content="TM6"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">'); })();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TM6</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";src:url("AtkinsonHyperlegible-Regular.ttf");font-weight:400}
@font-face{font-family:"Atkinson Hyperlegible";src:url("AtkinsonHyperlegible-Bold.ttf");font-weight:700}
@font-face{font-family:"Atkinson Hyperlegible Mono";src:url("AtkinsonHyperlegibleMono.ttf");font-weight:200 800}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
.top{top:0!important;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))!important}}
/* Parcours guidé du TM6. Univers : instrument de mesure dans un couloir d'hôpital.
   Fond lino clair, pétrole pour la navigation et les actions, jaune de ruban de signalisation réservé aux plots et au comptage. */
:root{
  --bg:#edf1ed; --surface:#ffffff; --fg:#15232b; --muted:#56646a; --line:#c5cfca; --field:#f7f9f7;
  --accent:#0e4f5e; --accent-fg:#ffffff; --accent-soft:#dbe9ec;
  --tape:#f2c230; --tape-ink:#1d1a10; --rail:#0e4f5e; --rail-fg:#e4eef0; --rail-muted:#9fbcc3;
  --spo2:#1e66a8; --fc:#b8501f; --alert:#b42318; --alert-soft:#fbe7e4; --warn:#8a5a00; --warn-soft:#fdf1d4; --ok:#1d7a46;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-num:"Atkinson Hyperlegible Mono","SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --surface:#172126; --fg:#e7eeea; --muted:#9eaeb0; --line:#33444a; --field:#1c282d;
  --accent:#4fb0bf; --accent-fg:#06222a; --accent-soft:#173a42;
  --tape:#e9bb2c; --tape-ink:#1d1a10; --rail:#0b2a31; --rail-fg:#e4eef0; --rail-muted:#7f9ea5;
  --spo2:#5cb0ee; --fc:#ef8a4f; --alert:#ff7a6c; --alert-soft:#3b1814; --warn:#e5a845; --warn-soft:#352a12; --ok:#55c98a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517; --surface:#172126; --fg:#e7eeea; --muted:#9eaeb0; --line:#33444a; --field:#1c282d;
  --accent:#4fb0bf; --accent-fg:#06222a; --accent-soft:#173a42;
  --tape:#e9bb2c; --tape-ink:#1d1a10; --rail:#0b2a31; --rail-fg:#e4eef0; --rail-muted:#7f9ea5;
  --spo2:#5cb0ee; --fc:#ef8a4f; --alert:#ff7a6c; --alert-soft:#3b1814; --warn:#e5a845; --warn-soft:#352a12; --ok:#55c98a;
  color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
/* Deux touchers rapides sur « +1 aller » ne doivent pas zoomer la page. */
html,body,button,input,select,textarea,label,a{touch-action:manipulation}
body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:17px/1.4 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}

/* Bandeau maquette et barre d'étapes */
.toast{position:fixed;left:50%;bottom:110px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;z-index:60;display:none;max-width:90%}
.toast.on{display:block}
.rtg{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));grid-gap:6px 6px;-webkit-align-items:center;align-items:center}
.rtg .f{margin:0}
.rtg .f .box{padding:0 6px}
.rtg .f input{padding:7px 0;font-size:20px!important;text-align:center}
.rth{font-size:14px;color:var(--muted);font-weight:700;padding-right:4px;line-height:1.15}
.rtn{font-size:14px;font-weight:700;color:var(--muted);text-align:center}
.o2ok{width:100%;margin-top:14px}
.sp12{height:12px}
.hint.corr{margin:-4px 0 14px}
.o2btn{width:100%;min-height:56px;border:2px solid var(--accent);border-radius:var(--r);background:var(--surface);color:var(--accent);font-size:18px;font-weight:700;margin-bottom:4px}
.fig .o2c{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.newtest{display:block;width:100%;margin-top:14px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:14px;padding:8px 16px;text-align:center}
.top{position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:720px;margin:0 auto;padding:10px 16px 8px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.steps{display:-webkit-flex;display:flex;-webkit-flex:1;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
.step{-webkit-flex:0 0 auto;flex:0 0 auto;margin-right:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;color:var(--muted)}
.step.done{border-color:var(--accent);color:var(--accent)}
.step.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step .num{display:none}
.step.miss::after{content:" !";color:var(--warn)}
.step.cur.miss::after{color:var(--accent-fg)}
.gobar{font-size:24px;letter-spacing:.05em;line-height:1.1}
.gobar small{display:block;font-size:13px;letter-spacing:0;font-weight:400;margin-top:2px}
.gear svg{display:block;margin:auto}
.gear{-webkit-flex:0 0 auto;flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;line-height:1;margin-left:6px}
.runbar{display:none;background:var(--accent);color:var(--accent-fg);text-align:center;font-weight:700;padding:10px;border:0;width:100%}
.runbar.on{display:block}

h1{font-size:28px;line-height:1.15;margin:20px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr}}

/* Champs : grands, bordure visible, unité à droite */
.f{display:block}
.f span{display:block;font-size:15px;color:var(--muted);margin-bottom:6px}
.f .box{display:grid;grid-template-columns:minmax(0,1fr) auto;-webkit-align-items:center;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--field);padding:0 12px}
.f input{border:0;background:transparent;width:100%;min-width:0;padding:12px 0;font:700 24px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.f input:focus{outline:none}
.tf{margin-bottom:12px}
.f input.tin{border:2px solid var(--line);border-radius:12px;background:var(--field);padding:12px;font:17px/1.3 var(--f-body)}
.f input.tin:focus{border-color:var(--accent)}
/* Modèle du dispositif : même gabarit que les champs chiffrés (et leurs tailles par écran), police du texte. */
.f input.dev{font-family:var(--f-body);font-weight:400;font-variant-numeric:normal}
.f .box:focus-within{border-color:var(--accent)}
.f.bad .box{border-color:var(--alert);background:var(--alert-soft)} /* valeur hors des limites plausibles, non prise en compte */
.f .u{display:inline;color:var(--muted);font-size:15px;margin:0 0 0 6px;white-space:nowrap}

/* Choix par boutons */
.choice{display:grid;grid-gap:10px}
.choice.c2{grid-template-columns:1fr 1fr}
.choice.c3{grid-template-columns:1fr 1fr 1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;font-weight:700;font-size:17px;min-height:56px;text-align:center}
.opt small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.borg{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:6px}
.borg .opt{padding:8px 4px;min-height:58px;font:700 20px/1.1 var(--f-num)}
.borg .opt small{font:400 12px/1.15 var(--f-body);margin-top:3px}
.borgrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--field);margin-bottom:10px}
.borgrow .bl{min-width:0;margin-right:10px}
.borgrow .bv{display:block;font:700 22px/1.2 var(--f-num);margin-top:4px}
.borgrow .bw{font:700 18px/1.2 var(--f-body);margin-left:6px}
.showscale{border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:14px 16px;min-height:56px;-webkit-flex:0 0 auto;flex:0 0 auto}
/* Échelle présentée au patient : plein écran, très gros caractères (l'ATS demande une échelle imprimée en grand). */
.scale{position:fixed;left:0;right:0;top:0;bottom:0;z-index:30;background:var(--surface);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.scop{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px}
.scq{font-size:30px;line-height:1.2;font-weight:700;margin:16px 0 8px;text-wrap:balance}
.scbefore{font-size:22px;margin:0 0 10px;color:var(--accent);font-weight:700}
.sclist{display:grid;grid-gap:6px}
.scitem{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 14px;min-height:64px}
.scitem .n{font:700 34px/1 var(--f-num);width:72px;-webkit-flex:0 0 72px;flex:0 0 72px}
.scitem .w{font-size:24px;font-weight:700;line-height:1.15}
.scitem.on{border-color:var(--accent);background:var(--accent-soft)}
.scexpl{font-size:15px;color:var(--muted);margin:14px 0 0}
.scclose{width:100%;margin-top:14px}
.scbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.scbar .ghost{width:100%}
.nadirrow{margin-top:12px}
.nadirrow .f{display:grid;grid-template-columns:minmax(0,1fr) 130px;grid-gap:12px;-webkit-align-items:center;align-items:center}
.nadirrow .f span:first-child{margin:0}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px}
.guide summary{padding:14px 16px;font-weight:700;cursor:pointer}
.guide .gtxt{padding:0 16px 16px;white-space:pre-wrap;font-size:16px;line-height:1.5}

.hint{font-size:15px;color:var(--muted);margin:8px 0 0}
.alert{background:var(--alert-soft);color:var(--alert);border:2px solid var(--alert);border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:12px}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}

.next{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.next .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;grid-gap:10px}
.big{border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:20px;padding:16px;min-height:60px}
.ghost{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700;padding:14px 18px}

/* Écran Prêt */
.check{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin-bottom:10px;font-weight:700}
.check i{-webkit-flex:0 0 32px;flex:0 0 32px;height:32px;border-radius:8px;border:2px solid var(--line);margin-right:12px;font-style:normal;text-align:center;line-height:28px}
.check.on{border-color:var(--accent)}
.check.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.go{width:100%;border:0;border-radius:24px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:40px;letter-spacing:.06em;padding:42px 16px;margin-top:8px}
.go small{display:block;font-size:18px;letter-spacing:0;font-weight:700;margin-top:8px}
.go small+small{font-weight:400;margin-top:2px}
.consignes{font-size:19px;line-height:1.5;background:var(--field);border-radius:12px;padding:14px;border-left:4px solid var(--accent)}
.ta{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--field);padding:12px;font:17px/1.45 var(--f-body);color:var(--fg)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;padding:4px}
.readout{border-left:5px solid var(--tape);padding:4px 0 4px 14px;margin:4px 0 14px}
.readout .rl{display:block;color:var(--muted);font-size:15px}
.readout .rv{display:block;font:700 36px/1.1 var(--f-num)}
.readout .rs{display:block;font-size:16px}
.readout.na .rv{color:var(--muted)}
.pred .na{color:var(--muted)}
.testinfo{text-align:center;color:var(--muted);font-size:15px;margin:12px 0 0}

/* Écran Test */
.track{margin:4px 0 14px}
.track svg{display:block;width:100%;height:auto}
.track .lane{stroke:var(--line);stroke-width:10;stroke-linecap:round}
.track .cone{fill:var(--tape);stroke:var(--tape-ink);stroke-width:2}
.track .pt{fill:var(--accent)}
.track .tick{stroke:var(--muted);stroke-width:2}
.track .startl{stroke:var(--fg);stroke-width:4;stroke-linecap:round}
.track text{font:700 15px var(--f-body);fill:var(--muted)}
.clock{text-align:center;margin-top:12px}
.clock .t{font:700 72px/1 var(--f-num);font-variant-numeric:tabular-nums}
.clock .r{color:var(--muted);font-size:17px;margin-top:4px}
.bar{position:relative;height:14px;border-radius:7px;background:var(--line);margin:12px 0 4px;overflow:hidden}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--rail)}
.bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.phrase{min-height:48px;text-align:center;font-size:17px;margin:8px 0 12px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.minstrip{display:grid;grid-template-columns:repeat(6,1fr);grid-gap:6px;margin-bottom:12px}
.mn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;text-align:center;font-size:13px;color:var(--muted);min-height:54px}
.mn b{display:block;font:700 17px var(--f-num);color:var(--fg)}
.mn.due{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.mn.ok{border-color:var(--ok)}
.mn.on{outline:3px solid var(--warn);outline-offset:1px}
.prompt{border:3px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:12px;margin-bottom:12px}
.prompt h3{margin:0 0 8px;font-size:19px;color:var(--warn)}
.prompt .grid2{grid-gap:10px}
.prompt .row{display:grid;grid-template-columns:1fr auto;grid-gap:10px;margin-top:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-gap:10px;-webkit-align-items:end;align-items:end}
.prow .ghost{min-height:52px}
.lap{width:100%;border:0;border-radius:24px;background:var(--tape);color:var(--tape-ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);padding:26px 16px;min-height:200px;font-weight:700}
.lap .p{display:block;font-size:44px;line-height:1}
.lap .d{display:block;font:700 22px var(--f-body);margin-top:10px}
.ctl{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;grid-gap:10px;margin-top:12px}
.ctl button{border-radius:var(--r);font-weight:700;font-size:17px;min-height:64px;padding:8px}
.b-undo{border:2px solid var(--line);background:var(--surface)}
.b-pause{border:3px solid var(--warn);background:var(--surface);color:var(--warn)}
.b-pause.on{background:var(--warn);color:#fff}
.b-stop{border:3px solid var(--alert);background:var(--surface);color:var(--alert)}

/* Panneaux pleine largeur (pause, arrêt, minute) */
.sheet{position:fixed;left:0;right:0;bottom:0;top:0;z-index:20;background:rgba(5,12,16,.45);display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end}
.sheet .pane{width:100%;max-width:720px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.pane h2{margin:0 0 4px;font-size:24px}
.pane .sub{color:var(--muted);margin:0 0 14px}
.pausebig{font:700 56px/1 var(--f-num);text-align:center;color:var(--warn);margin:4px 0 12px}
.b-resume{width:100%;border:0;border-radius:var(--r);background:var(--warn);color:var(--surface);font-weight:700;font-size:22px;min-height:72px;margin-top:14px}
.b-confirm{width:100%;border:0;border-radius:var(--r);background:var(--alert);color:#fff;font-weight:700;font-size:20px;min-height:64px;margin-top:14px}
.b-cancel{width:100%;margin-top:10px}

/* Récupération */
.rtabs{display:none}
.rtstop{display:none}
.rec{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;margin-bottom:12px}
.rt{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;text-align:center}
.rt b{display:block;font:700 34px/1 var(--f-num)}

.rt.due{border-color:var(--warn);background:var(--warn-soft)}
.rt.ok{border-color:var(--ok)}
.slider{width:100%;height:44px}

/* Bilan */
.fig{display:block;width:100%;height:auto}
.fig .recz{fill:var(--line);opacity:.35}
.fig .pz{fill:var(--tape);opacity:.28}
.fig .ax{stroke:var(--line);stroke-width:1}
.fig .ln{fill:none;stroke-width:2.5}
.fig .ln.sp,.fig .pt.sp{stroke:var(--spo2)} .fig .pt.sp{fill:var(--spo2)}
.fig .ln.fc,.fig .pt.fc{stroke:var(--fc)} .fig .pt.fc{fill:var(--fc)}
.fig .ln.vt,.fig .pt.vt{stroke:var(--accent)} .fig .pt.vt{fill:var(--accent)}
.fig .ln.ds,.fig .pt.ds{stroke:var(--fg)} .fig .pt.ds{fill:var(--fg)}
.fig .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.fig .pt.rc{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.fig .fin{stroke:var(--fg);stroke-width:2}
.fig text{font-family:var(--f-body);fill:var(--muted)}
.fig .lbl{font-size:13px} .fig .lbl.b{font-weight:700;fill:var(--fg)}
.fig .vl{font-size:12px;fill:var(--fg)}
.fig .tk{font-size:14px;font-weight:700} .fig .tk.sp{fill:var(--spo2)} .fig .tk.fc{fill:var(--fc)} .fig .tk.vt{fill:var(--accent)} .fig .tk.ds{fill:var(--fg)}
.vals{width:100%;border-collapse:collapse}
.vals th{text-align:left;font-weight:700;font-size:15px;padding:8px 10px 8px 0;vertical-align:top;width:38%;border-bottom:1px solid var(--line)}
.vals td{font:700 16px/1.3 var(--f-num);padding:8px 0;border-bottom:1px solid var(--line)}
.vals td small{display:block;font:400 13px/1.35 var(--f-body);color:var(--muted);margin-top:2px}
.vals .na,.ix .na{color:var(--muted)}
.ix{display:-webkit-flex;display:flex;border-bottom:1px solid var(--line);padding:8px 0;-webkit-column-break-inside:avoid;break-inside:avoid;page-break-inside:avoid}

var ac = null;

function corridor() { return ok(S.couloir) ? num(S.couloir) : 30; }

// Départ ailleurs qu'à un plot (salle de l'oxymètre au milieu du couloir) : le premier passage à un plot ne compte
// que la distance de la ligne de départ à ce plot ; 0 = départ au plot. La norme ERS/ATS 2014 (Holland 2014, « Recording
// performance of the 6MWT ») demande de relever le nombre d'allers et la distance du dernier aller partiel ; elle ne place
// pas la ligne de départ à un bout du couloir, mais demande de garder le même parcours d'un test à l'autre.
function depart() { var d = num(S.depart), c = corridor(); return d > 0 && d < c ? d : 0; }

function cumDist(n) { return n <= 0 ? 0 : depart() ? depart() + (n - 1) * corridor() : n * corridor(); }

function dist() { return cumDist(nLaps()) + (S.stop ? num(S.end.partiel) || 0 : 0); }
function predicted() {
  var a = num(S.age), h = num(S.taille), w = num(S.poids);
  if (isNaN(a) || isNaN(h) || isNaN(w) || (S.sex !== 'F' && S.sex !== 'M')) return null;
  var p = S.sex === 'M' ? 7.57 * h - 5.02 * a - 1.76 * w - 309 : 2.11 * h - 2.29 * w - 5.78 * a + 667;
  return { p: Math.round(p), lin: Math.round(p - (S.sex === 'M' ? 153 : 139)) };

// Courbes : le SVG de l'écran, passé en noir et gris pour l'impression, rendu en PNG.
const PRINT = { '--band': '#e0e0e0', '--rec': '#f2f2f2', '--ink': '#000000', '--spo2': '#000000', '--fc': '#000000', '--line': '#d9d9d9', '--muted': '#595959', '--alert': '#808080', '--surface': '#ffffff', '--f-num': 'Arial, Helvetica, sans-serif' };

  return new Promise(resolve => {
    const xml = markup.replace(/var\((--[\w-]+)\)/g, (m, v) => PRINT[v] || '#000000')
      .replace('<svg ', `<svg font-family="${PRINT['--f-num']}" `);
    const img = new Image();
    img.onload = () => {
      try {
        const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, cw, ch); g.drawImage(img, 0, 0, cw, ch);

// Vitesse : globale (durée totale) et pendant la marche (arrêts exclus) ; vitesse de chaque aller sans ses arrêts.
function pauseWithin(a, b) { return pauses.reduce((sum, p) => sum + Math.max(0, Math.min(b, p.e ?? endT) - Math.max(a, p.s)), 0); }
function speedStats(dist) {
  const walk = endT - pauseTotal();
  if (!(endT > 0) || !(walk > 0)) return null;
  return { total: endT, walk, mTot: dist / endT * 60, kmhTot: dist / endT * 3.6, mWalk: dist / walk * 60, kmhWalk: dist / walk * 3.6 };
}
function speedSegments() {
  const segs = []; let prev = 0;
  const add = (a, b, metres) => { const w = (b - a) - pauseWithin(a, b); if (w >= 1 && metres > 0) segs.push({ a, b, v: metres / w * 60 }); };
  lapTimes.forEach((t, i) => { if (t > prev) add(prev, t, lapLen(i)); prev = t; });

function speedSvg(st, dim = {}) {

  const segs = speedSegments().map(sg => ({ t: (sg.a + sg.b) / 2, v: sg.v * 0.06 }));
  if (!segs.length) return null;
  const W = dim.W || 320, H = dim.H || 130, L = 30, R = 10, T = 8, B = 22, fs = dim.fs || 10, xMax = dim.xMax || 6;
  const walk = st ? st.kmhWalk : 0, tot = st ? st.kmhTot : 0;
  const both = st && pauses.length && Math.abs(walk - tot) > 0.05;
  const hi = Math.max(2, Math.ceil(Math.max(...segs.map(sg => sg.v), walk) + 0.5)), step = hi > 8 ? 2 : 1;
  const x = sec => L + Math.min(sec / 60, 6) / xMax * (W - L - R), y = v => T + (hi - v) / hi * (H - T - B);
  let g = '';
  pauses.forEach(p => { const e = p.e ?? endT; if (e > p.s) g += `<rect x="${x(p.s)}" y="${T}" width="${Math.max(1, x(e) - x(p.s))}" height="${H - T - B}" fill="var(--band)"/>`; });
  for (let v = 0; v <= hi; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 5}" y="${y(v) + 3.5}" text-anchor="end" fill="var(--muted)" font-size="${fs}">${v}</text>`;
  for (let t = 0; t <= 6; t++) g += `<text x="${x(t * 60)}" y="${H - 7}" text-anchor="middle" fill="var(--muted)" font-size="${fs}">${t}</text>`;
  if (st) g += `<line x1="${L}" x2="${W - R}" y1="${y(walk)}" y2="${y(walk)}" stroke="var(--alert)" stroke-dasharray="5 3" stroke-width="1.2"/>`;
  if (both) g += `<line x1="${L}" x2="${W - R}" y1="${y(tot)}" y2="${y(tot)}" stroke="var(--muted)" stroke-dasharray="1.5 2.5" stroke-width="1.2"/>`;

// Figure polygraphique : une piste par paramètre (SpO2, FC, vitesse, débit d'O2 si présent), empilées,
// un seul axe du temps ; repères de minutes, trait de fin et bandes d'arrêt sur toute la hauteur.
function polySvg(c, st) {
  const has3 = c.rec3 && (ok(c.rec3.s) || ok(c.rec3.f));
  const W = 640, L = 70, PR = 460, LEG = 476, fs = 11, xMax = has3 ? endT / 60 + 3.4 : 7;
  const x = min => L + Math.min(min, xMax) / xMax * (PR - L);
  const endMin = endT / 60, air = $('o2mode').value === 'air';
  const lanes = [{ k: 's', name: 'SpO2', unit: '%', h: 72 }, { k: 'f', name: LG('FC', 'HR'), unit: '/min', h: 72 }, { k: 'v', name: LG('Vitesse', 'Speed'), unit: 'km/h', h: 62 }];
  if (!air) lanes.push({ k: 'o', name: 'O2', unit: pulsed() ? LG('réglage', 'setting') : 'L/min', h: 44 });
  let y0 = 4; lanes.forEach(l => { l.top = y0; y0 += l.h; l.bot = y0; });
  const top = 4, bot = y0, H = bot + 34;
  let g = '';
  // Fond : récupération grisée, arrêts sur toute la hauteur, repères de minutes.
  const recEnd = PR;
  g += `<rect x="${x(endMin)}" y="${top}" width="${recEnd - x(endMin)}" height="${bot - top}" fill="var(--rec)"/>`;
  pauses.forEach(p => { const e = (p.e ?? endT) / 60; if (e > p.s / 60) g += `<rect x="${x(p.s / 60)}" y="${top}" width="${Math.max(1.5, x(e) - x(p.s / 60))}" height="${bot - top}" fill="var(--band)"/>`; });
  for (let t = 1; t <= 6; t++) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${bot}" stroke="var(--line)" stroke-width="1"/>`;
  lanes.forEach((l, i) => { if (i) g += `<line x1="${L}" x2="${PR}" y1="${l.top}" y2="${l.top}" stroke="var(--ink)" stroke-width="0.6"/>`; });
  g += `<rect x="${L}" y="${top}" width="${PR - L}" height="${bot - top}" fill="none" stroke="var(--ink)" stroke-width="0.8"/>`;
  const label = (l) => `<text x="${L - 6}" y="${(l.top + l.bot) / 2 - 2}" text-anchor="end" font-size="${fs}" font-weight="bold" fill="var(--ink)">${l.name}</text><text x="${L - 6}" y="${(l.top + l.bot) / 2 + 11}" text-anchor="end" font-size="${fs - 1}" fill="var(--muted)">${l.unit}</text>`;
  const legend = (l, lines) => lines.map((t, i) => `<text x="${LEG}" y="${l.top + 16 + i * 13}" font-size="${fs - 1}" fill="var(--muted)">${t}</text>`).join('');
  // Points d'une série : valeur écrite au-dessus de chaque point (ou au-dessous si la place manque).
  const series = (l, pts, recs, every = 1, extra = []) => {
    const vals = pts.map(p => p.v).concat(recs.map(r => r.v)).concat(extra);
    let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 4) { lo -= 2; hi += 2; }
    const y = v => l.bot - 12 - (v - lo) / (hi - lo) * (l.h - 30);
    let s = '';
    if (pts.length > 1) s += `<polyline fill="none" stroke="var(--ink)" stroke-width="1.6" points="${pts.map(p => `${x(p.t)},${y(p.v)}`).join(' ')}"/>`;
    if (recs.length && pts.length) s += `<polyline fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3" points="${[pts[pts.length - 1], ...recs].map(p => `${x(p.t)},${y(p.v)}`).join(' ')}"/>`;
    const minV = Math.min(...pts.map(p => p.v));
    pts.forEach((p, i) => {
      s += `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3" fill="var(--ink)"/>`;
      if (i % every === 0 || p.v === minV || i === pts.length - 1) {
        const yy = y(p.v) - 6 < l.top + 14 ? y(p.v) + 15 : y(p.v) - 6;
        const atEnd = Math.abs(x(p.t) - x(endMin)) < 3, atStart = i === 0 && x(p.t) - L < 8; // ni sur le trait de fin, ni sur le bord gauche
        s += `<text x="${atEnd ? x(p.t) - 5 : atStart ? x(p.t) + 5 : x(p.t)}" y="${yy}" text-anchor="${atEnd ? 'end' : atStart ? 'start' : 'middle'}" font-size="${fs - 1}" fill="var(--ink)">${fr(p.v)}</text>`;
      }
    });
    // Récupération : cercle vide, valeur écrite à gauche du cercle pour ne pas le recouvrir.
    recs.forEach(r => { s += `<circle cx="${x(r.t)}" cy="${y(r.v)}" r="3" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="${x(r.t) - 6}" y="${y(r.v) + 4}" text-anchor="end" font-size="${fs - 1}" fill="var(--ink)">${fr(r.v)}</text>`; });
    return { s, y };
  };
  lanes.forEach(l => {
    g += label(l);
    if (l.k === 's' || l.k === 'f') {
      // Mesures prises pendant les arrêts : tracées au début de l'arrêt, comme dans le bilan.
      const pts = endOverride(c.pts.filter(p => ok(p[l.k])), l.k).concat(pauseVals.filter(p => ok(p[l.k]))).sort((a, b) => a.t - b.t).map(p => ({ t: p.t, v: p[l.k] }));
      const recs = [c.rec, c.rec3].filter(r => r && ok(r[l.k])).map(r => ({ t: Math.min(r.t, xMax), v: r[l.k] }));
      if (!pts.length) { g += `<text x="${(L + PR) / 2}" y="${(l.top + l.bot) / 2 + 4}" text-anchor="middle" font-size="${fs - 1}" fill="var(--muted)">${LG('Aucun relevé', 'No readings')}</text>`; return; }
      const r = series(l, pts, recs, 1, []);
      g += r.s;
      if (l.k === 's') g += legend(l, [LG('Cercle vide : récupération', 'Open circle: recovery')]);
    } else if (l.k === 'v') {
      const pts = speedSegments().map(sg => ({ t: (sg.a + sg.b) / 120, v: Math.round(sg.v * 0.06 * 10) / 10 }));
      if (!pts.length) { g += `<text x="${(L + PR) / 2}" y="${(l.top + l.bot) / 2 + 4}" text-anchor="middle" font-size="${fs - 1}" fill="var(--muted)">${LG('Heures de passage non enregistrées', 'Passage times not recorded')}</text>`; return; }
      const r = series(l, pts, [], 2, st ? [st.kmhWalk] : []);
      if (st) g += `<line x1="${L}" x2="${x(endMin)}" y1="${r.y(st.kmhWalk)}" y2="${r.y(st.kmhWalk)}" stroke="var(--alert)" stroke-dasharray="5 3" stroke-width="1"/>`;
      g += r.s;
      g += legend(l, [LG('Un point par aller', 'One point per length'), st ? LG(`Tirets : moyenne ${fr(st.kmhWalk)} km/h`, `Dashes: mean ${fr(st.kmhWalk)} km/h`) : '', pauses.length ? LG('Bande grise : arrêt', 'Grey band: stop') : ''].filter(Boolean));
    } else {
      const v0 = num('o2debit'), steps = [{ t: 0, v: v0 }, ...o2changes.map(ch => ({ t: ch.t / 60, v: ch.v }))].filter(p => ok(p.v));

      const y = v => hi === lo ? (l.top + l.bot) / 2 + 4 : l.bot - 9 - (v - lo) / (hi - lo) * (l.h - 24);
      let pts = []; steps.forEach((p, i) => { if (i) pts.push(`${x(p.t)},${y(steps[i - 1].v)}`); pts.push(`${x(p.t)},${y(p.v)}`); });
      pts.push(`${PR},${y(steps[steps.length - 1].v)}`);
      g += `<polyline fill="none" stroke="var(--ink)" stroke-width="2.2" points="${pts.join(' ')}"/>`;
      steps.forEach((p, i) => { g += `<text x="${x(p.t) + 4}" y="${y(p.v) - 4}" font-size="${fs - 1}" fill="var(--ink)">${fr(p.v)}${i ? ` (${mmss(p.t * 60)})` : ''}</text>`; });
      const rest = restSteps();
      const at2 = st2 => EN ? `${fr(st2.s)}% at ${fr(st2.d)}` : `${fr(st2.s)} % à ${fr(st2.d)}`;
      g += legend(l, rest.length ? [LG('Repos : ', 'Rest: ') + rest.slice(0, 2).map(at2).join(', ') + (rest.length > 2 ? ',' : ''), rest.length > 2 ? rest.slice(2).map(at2).join(', ') : ''].filter(Boolean) : [LG('Valeur appliquée', 'Value applied')]);
    }
  });
  // Trait de fin et axe du temps.
  g += `<line x1="${x(endMin)}" x2="${x(endMin)}" y1="${top}" y2="${bot}" stroke="var(--ink)" stroke-width="1.8"/>`;
  for (let t = 0; t <= 6; t++) if (Math.abs(t - endMin) > 0.15) g += `<text x="${x(t)}" y="${bot + 14}" text-anchor="middle" font-size="${fs - 1}" fill="var(--muted)">${t}</text>`;
  g += `<text x="${x(endMin)}" y="${bot + 14}" text-anchor="middle" font-size="${fs}" font-weight="bold" fill="var(--ink)">${LG('Fin', 'End')}${stopReason ? ' ' + mmss(endT) : ''}</text>`;
  [[c.rec, '+1 min'], [c.rec3, '+3 min']].forEach(([r, lab]) => { if (r && (ok(r.s) || ok(r.f))) g += `<text x="${x(Math.min(r.t, xMax))}" y="${bot + 14}" text-anchor="middle" font-size="${fs - 1}" fill="var(--muted)">${lab}</text>`; });
  g += `<text x="${(L + PR) / 2}" y="${bot + 29}" text-anchor="middle" font-size="${fs - 1}" fill="var(--muted)">${LG('Temps (min)', 'Time (min)')}</text>`;
  return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${g}</svg>`, W, H };
}

  const o2txt = air0 ? (EN ? `room air at the start, then ${opt('o2mode').toLowerCase()}, ${pulsed() ? `pulsed flow${o2dev() ? `, device ${o2dev()}` : ''}` : 'continuous flow'}, ${srcTxt}`
      : `air ambiant au départ, puis ${opt('o2mode').toLowerCase()}, ${pulsed() ? `débit pulsé${o2dev() ? `, dispositif ${o2dev()}` : ''}` : 'débit continu'}, ${srcTxt}`)
    : EN ? (air ? 'room air' : `${opt('o2mode').toLowerCase()}, ${pulsed() ? `pulsed flow, setting ${deb}${o2dev() ? `, device ${o2dev()}` : ''}` : `continuous flow, ${deb} L/min`}, ${srcTxt}`)
    : air ? 'air ambiant' : `${opt('o2mode').toLowerCase()}, ${pulsed() ? `débit pulsé, réglage ${deb}${o2dev() ? `, dispositif ${o2dev()}` : ''}` : `débit continu, ${deb} L/min`}, ${srcTxt}`;
  const aideTxt = $('aide').value === 'aucune' ? LG('sans aide', 'no walking aid') : `${LG('avec', 'with a')} ${opt('aide').toLowerCase()}`;
  const line = (k, v) => para([run(`${k}${LG(' : ', ': ')}`, { b: true }), run(v)], { after: 40 });
  body.push(H('Conditions'));
  body.push(tbl([tr([cell(
    line(EN ? 'Patient' : sex === 'F' ? 'Patiente' : 'Patient', `${ageTxt}.`) +
    line(LG('Oxygène', 'Oxygen'), `${o2txt}.`) +
    line(LG('Marche', 'Walk'), `${aideTxt}, ${LG(`couloir de ${corridor()} m`, `${corridor()} m corridor`)}${departTxt()}.`), BODY_W)])], [BODY_W]));

  // Performance, juste après : le tableau le plus parlant.
  const c = compute(), desat = ok(c.sRest) && ok(c.nadir) ? c.sRest - c.nadir : NaN, sp = speedStats(c.dist);
  const sy = symptoms();
  const perf = EN ? [
    ['Distance', `${Math.round(c.dist)} m${c.pr ? `, i.e. ${c.pct}% of the predicted value (${c.pr.p} m; LLN ${c.pr.lin} m)` : ', predicted value not calculated (age, height or weight missing)'}`],
    ['Speed', sp ? (pauses.length ? `${fr(sp.kmhTot)} km/h overall (${fr(sp.mTot)} m/min), ${fr(sp.kmhWalk)} km/h while walking (${fr(sp.mWalk)} m/min)` : `${fr(sp.kmhTot)} km/h (${fr(sp.mTot)} m/min), no stops`) : dash],
    ['Oxygenation', ok(c.nadir) ? `Nadir ${c.nadir}%, ${!ok(desat) ? 'desaturation not calculated (resting SpO2 missing)' : desat > 0 ? `desaturation of ${desat} point${desat > 1 ? 's' : ''}` : 'no desaturation'}` : dash],
    ['Course of the test', `${$('endStatus').textContent} ${pauses.length ? `${pauses.length === 1 ? 'One stop' : `${pauses.length} stops`}, ${Math.round(pauseTotal())} s in total.` : 'No stops.'}`],
    ['Limiting symptoms', sy.length ? sy.map(tv).join(', ') : 'none reported']
  ] : [
    ['Distance', `${Math.round(c.dist)} m${c.pr ? `, soit ${c.pct} % de la valeur théorique (${c.pr.p} m ; LIN ${c.pr.lin} m)` : ', valeur théorique non calculée (âge, taille ou poids manquant)'}`],
    ['Vitesse', sp ? (pauses.length ? `${fr(sp.kmhTot)} km/h globale (${fr(sp.mTot)} m/min), ${fr(sp.kmhWalk)} km/h pendant la marche (${fr(sp.mWalk)} m/min)` : `${fr(sp.kmhTot)} km/h (${fr(sp.mTot)} m/min), sans arrêt`) : dash],
    ['Oxygénation', ok(c.nadir) ? `Nadir ${c.nadir} %, ${!ok(desat) ? 'désaturation non calculée (SpO2 de repos manquante)' : desat > 0 ? `désaturation de ${desat} point${desat > 1 ? 's' : ''}` : 'sans désaturation'}` : dash],
    ['Déroulement', `${$('endStatus').textContent} ${pauses.length ? `${pauses.length === 1 ? 'Un arrêt' : `${pauses.length} arrêts`}, ${Math.round(pauseTotal())} s au total.` : 'Aucun arrêt.'}`],
    ['Symptômes limitants', sy.length ? sy.join(', ') : 'aucun rapporté']
  ];
  body.push(H('Performance'));
  body.push(tbl(perf.map(([k, v]) => tr([cell(P(k, { b: true, after: 0 }), cols([0.24, 0.76])[0]), cell(P(v, { after: 0 }), cols([0.24, 0.76])[1])])), cols([0.24, 0.76])));

  // Puis l'interprétation.
  const parts = $('txt').value.split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
  body.push(H(LG('Synthèse', 'Summary')));
  (parts[0] || '').split(/\n+/).filter(Boolean).forEach(l => body.push(P(l, { jc: 'both' })));

  // Récapitulatif repos / fin / récupération (mêmes calculs que l'app).
  const fmtPct = ok(c.fPeak) && ok(c.fmt) ? Math.round(c.fPeak / c.fmt * 100) : null;
  const spoEnd = ok(c.sEnd) ? `${c.sEnd}${ok(c.nadir) && c.nadir < c.sEnd ? ` (nadir ${c.nadir})` : ''}` : (ok(c.nadir) ? `nadir ${c.nadir}` : '');
  const fcEnd = ok(c.fEnd) ? `${c.fEnd}${ok(c.fPeak) && c.fPeak > c.fEnd ? ` (max ${c.fPeak}` : ''}${fmtPct != null ? `${ok(c.fPeak) && c.fPeak > c.fEnd ? ', ' : ' ('}${fmtPct} % ${LG('FMT', 'max HR')})` : (ok(c.fPeak) && c.fPeak > c.fEnd ? ')' : '')}` : '';
  const taCell = (sId, dId) => (taStr(sId, dId) || '').replace(' mmHg', '');
  const bg = id => $(id).value === '' ? '' : fr(parseFloat($(id).value));
  const recap = [
    ['SpO2 (%)', cellv(c.sRest), spoEnd, cellv(num('spo2Rec'))],
    [LG('Fréquence cardiaque (/min)', 'Heart rate (/min)'), cellv(c.fRest), fcEnd, cellv(num('fcRec'))],
    [LG('Pression artérielle (mmHg)', 'Blood pressure (mmHg)'), taCell('ta0s', 'ta0d'), taCell('ta1s', 'ta1d'), taCell('taRs', 'taRd')],
    [LG('Dyspnée (Borg)', 'Dyspnoea (Borg)'), bg('borgD0'), bg('borgD1'), ''],
    [LG('Fatigue des membres inférieurs (Borg)', 'Leg fatigue (Borg)'), bg('borgF0'), bg('borgF1'), '']
  ];
  if (!air) recap.push([pulsed() ? LG('Oxygène (réglage)', 'Oxygen (setting)') : LG('Oxygène (L/min)', 'Oxygen (L/min)'), air0 ? LG('air', 'air') : cellv(num('o2debit')), cellv(o2At(endT)), cellv(o2At(endT))]);
  const has3 = ['spo2Rec3', 'fcRec3', 'taR3s', 'taR3d'].some(id => raw(id));
  if (has3) {
    const r3 = [cellv(num('spo2Rec3')), cellv(num('fcRec3')), taCell('taR3s', 'taR3d'), '', ''];
    recap.forEach((row, i) => row.push(i < r3.length ? r3[i] : cellv(o2At(endT))));
  }
  body.push(H(LG('Récapitulatif', 'Measurements')));
  body.push(ruled([LG('Paramètre', 'Parameter'), LG('Repos', 'Rest'), stopReason ? `${LG('Arrêt', 'Stop')} (${mmss(endT)})` : LG('Fin du test', 'End of test'), LG('Récupération (1 min)', 'Recovery (1 min)'), ...(has3 ? [LG('Récupération (3 min)', 'Recovery (3 min)')] : [])], recap, has3 ? cols([0.3, 0.14, 0.2, 0.18, 0.18]) : cols([0.36, 0.17, 0.27, 0.2])));

  const methods = EN ? 'Methods. Predicted value and lower limit of normal according to Enright and Sherrill (1998), equations established in adults aged 40 to 80 years. Predicted maximum HR: 220 minus age. Dyspnoea and fatigue: Borg CR10 scale. Nadir: lowest SpO2 recorded during the test, stops included. Significant desaturation: fall of at least 4 SpO2 points between rest and nadir. Overall speed: distance divided by the test duration; walking speed: distance divided by the duration excluding stops.' : "Méthodes. Valeur théorique et limite inférieure de la normale selon Enright et Sherrill (1998), équations établies chez des adultes de 40 à 80 ans. FMT théorique : 220 moins l'âge. Dyspnée et fatigue : échelle de Borg CR10. Nadir : SpO2 la plus basse relevée pendant le test, arrêts compris. Désaturation significative : baisse d'au moins 4 points de SpO2 entre le repos et le nadir. Vitesse globale : distance rapportée à la durée du test ; vitesse de marche : distance rapportée à la durée hors arrêts.";

  // Figure polygraphique : toutes les pistes dans un même cadre, un seul axe du temps.
  const media = [];
  const poly = polySvg(c, sp);
  const png = await svgPng(poly.svg, 1600, Math.round(1600 * poly.H / poly.W));
  const figW = Math.round(BODY_W / 56.693), figH = figW * poly.H / poly.W;
  // Titre et figure ensemble en haut de la page 2 (le titre ne reste pas seul en bas de la page 1).
  body.push(para(run(LG('Évolution au cours du test', 'Course of the test'), { b: true, sz: 21 }), { before: 0, after: 100, keep: true, rule: true, pageBreak: true }));
  if (png) { media.push({ n: 1, png }); body.push(para(picture(1, figW, figH), { after: 0 })); }
  else body.push(P(LG('Figure non disponible.', 'Figure not available.'), { i: true, sz: 15 }));

  // 6. Détail, présenté comme une feuille de surveillance : les minutes en colonnes.
  const last = endT >= TEST ? 6 : Math.floor(endT / 60);
  const heads = ['', LG('Repos', 'Rest'), ...Array.from({ length: last }, (_, i) => `${i + 1} min`), stopReason ? LG('Arrêt', 'Stop') : LG('Fin', 'End'), has3 ? LG('Récup. 1 min', 'Rec. 1 min') : LG('Récup.', 'Rec.'), ...(has3 ? [LG('Récup. 3 min', 'Rec. 3 min')] : [])];
  const rowOf = (label, ids) => [label, ...ids.map(id => raw(id))];
  const minIds = f => Array.from({ length: last }, (_, i) => `m${i + 1}${f}`);
  const det = [rowOf('SpO2 (%)', ['m0spo2', ...minIds('spo2'), 'spo2End', 'spo2Rec', ...(has3 ? ['spo2Rec3'] : [])]), rowOf(LG('FC (/min)', 'HR (/min)'), ['m0fc', ...minIds('fc'), 'fcEnd', 'fcRec', ...(has3 ? ['fcRec3'] : [])])];
  const firstW = Math.round(BODY_W * 0.17), restW = Math.floor((BODY_W - firstW) / (heads.length - 1));
  const detW = [firstW, ...heads.slice(1).map(() => restW)];
  body.push(H(LG('Détail minute par minute', 'Minute-by-minute detail')));
  body.push(ruled(heads, det, detW));
  const notes = [];
  if (raw('nadirIn')) notes.push(LG(`Nadir lu sur l'oxymètre : ${raw('nadirIn')} %.`, `Nadir read on the oximeter: ${raw('nadirIn')}%.`));
  notes.forEach(t => body.push(P(t, { before: 60, after: 0 })));

  if (parts.length > 1) {
    body.push(H(LG('Synthèse détaillée', 'Detailed summary')));
    parts.slice(1).join('\n').split(/\n+/).filter(Boolean).forEach(l => body.push(P(l, { jc: 'both' })));
  }

  // Indices exploratoires du bilan (analysis(), premier bloc de script), mêmes valeurs ; les indices non calculables sont omis.
  // Sources abrégées, reprises des textes du bilan (le détail reste dans le bilan), pour tenir dans les 2 pages.
  const explo = (typeof analysis === 'function' && S.stop ? analysis().explo : []).filter(r => r[1] !== null);
  if (explo.length) {
    // Tableau récapitulatif, trois indices par ligne (intitulé, valeur) ; sources dans l'encart Méthodes.
    body.push(para(run(LG('Indices exploratoires', 'Exploratory indices'), { b: true, sz: 21 }), { before: 160, after: 80, keep: true, rule: true }));
    const xw = cols([0.19, 0.14, 0.19, 0.14, 0.20, 0.14]), rows = [], c = (t, b, w) => cell(P(t, { b, sz: 14, after: 0 }), w);
    for (let i = 0; i < explo.length; i += 3) {
      const r = [0, 1, 2].map(k => explo[i + k] || ['', '']);
      rows.push(tr(r.flatMap((x, k) => [c(x[4] || x[0], false, xw[2 * k]), c(x[1], true, xw[2 * k + 1])])));
    }
    body.push(tbl(rows, xw));
  }

  body.push(para('', { before: 40, after: 0 }));
  body.push(tbl([tr([
    cell(P(`${LG('Opérateur : ', 'Assessor: ')}${cfg.operateur.trim() || '______________________'}`), half[0]),
    cell(P(LG('Signature :', 'Signature:')), half[1])
  ])], half, { borders: NOBORDER }));

  const methodsAll = methods + (explo.length ? LG(' Indices exploratoires, descriptifs (repères établis dans d\'autres populations) : ', ' Exploratory indices, descriptive (reference points established in other populations): ') + Array.from(new Set(explo.map(r => r[3]).filter(Boolean))).join(LG(' ; ', '; ')) + '.' : '');
  // Encart Méthodes en bas de page : cadre ancré au bas de la dernière page, hors du flux du texte.
  const box = ['top', 'left', 'bottom', 'right'].map(sd => `<w:${sd} w:val="single" w:sz="4" w:space="4" w:color="000000"/>`).join('');
  body.push(`<w:p><w:pPr><w:framePr w:w="${BODY_W}" w:wrap="notBeside" w:vAnchor="margin" w:hAnchor="margin" w:yAlign="bottom"/><w:pBdr>${box}</w:pBdr><w:spacing w:before="0" w:after="0"/><w:jc w:val="both"/></w:pPr>${run(methodsAll, { sz: 14, color: GREY })}</w:p>`);

  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const W_NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const footLeft = [isTitr ? LG("Titration de l'oxygène à l'effort", 'Exertional oxygen titration') : LG('Test de marche de 6 minutes', '6-minute walk test'), testWhen(d), cfg.service.trim()].filter(Boolean).join(' – ');
  const footer_xml = `${XML}<w:ftr ${W_NS}><w:p><w:pPr><w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="000000"/></w:pBdr><w:tabs><w:tab w:val="right" w:pos="${BODY_W}"/></w:tabs><w:spacing w:before="0" w:after="0"/></w:pPr>${run(footLeft, { sz: 16 })}<w:r><w:rPr><w:sz w:val="16"/></w:rPr><w:tab/></w:r>${run('Page ', { sz: 16 })}${field('PAGE')}${run(LG(' sur ', ' of '), { sz: 16 })}${field('NUMPAGES')}</w:p></w:ftr>`;
  const document_xml = `${XML}<w:document ${W_NS} xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body.join('')}<w:sectPr><w:footerReference w:type="default" r:id="rIdFooter"/><w:pgSz w:w="${PAGE_W}" w:h="16838"/><w:pgMar w:top="1000" w:right="${MARGIN}" w:bottom="1000" w:left="${MARGIN}" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `${XML}<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial" w:cs="Arial"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="${EN ? 'en-GB' : 'fr-FR'}"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const docRels = `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="${REL}/styles" Target="styles.xml"/><Relationship Id="rIdFooter" Type="${REL}/footer" Target="footer1.xml"/>${media.map(m => `<Relationship Id="rIdImg${m.n}" Type="${REL}/image" Target="media/figure${m.n}.png"/>`).join('')}</Relationships>`;
  const rootRels = `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
  const core = `${XML}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${LG('Compte rendu – Test de marche de 6 minutes', 'Report – 6-minute walk test')}</dc:title><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</dcterms:created></cp:coreProperties>`;
  const types = `${XML}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
  return zip([
    { name: '[Content_Types].xml', data: utf8(types) },
    { name: '_rels/.rels', data: utf8(rootRels) },
    { name: 'docProps/core.xml', data: utf8(core) },
    { name: 'word/document.xml', data: utf8(document_xml) },
    { name: 'word/styles.xml', data: utf8(styles) },
    { name: 'word/footer1.xml', data: utf8(footer_xml) },
    { name: 'word/_rels/document.xml.rels', data: utf8(docRels) },
    ...media.map(m => ({ name: `word/media/figure${m.n}.png`, data: m.png }))
  ]);
}


function base64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function mailParts() {
  const d = testDate(), dd = `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`, hh = EN ? `${pad2(d.getHours())}:${pad2(d.getMinutes())}` : `${pad2(d.getHours())}h${pad2(d.getMinutes())}`;
  // {time} et {long_date} : équivalents anglais de {heure} et {date_longue}, acceptés dans les deux langues.
  const fill = t => String(t).replace(/\{(date_longue|long_date)\}/g, testWhen(d)).replace(/\{date\}/g, dd).replace(/\{(heure|time)\}/g, hh);
  return {
    // En anglais : abréviation anglaise (6MWT) et heure 10-18, « 10h18 » étant une notation française.
    filename: (EN ? '6MWT_' : 'TM6_') + `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}_` + (EN ? hh.replace(':', '-') : hh) + '.docx',
    subject: fill(cfg.mailSubject), body: fill(cfg.mailBody)
  };
}
  /* ----- Fin de la reprise ----- */

  const say = t => { const b = document.getElementById('sendBtn'); if (b) b.textContent = t; };
  // Appelée par l'app native une fois le mail ou le partage terminé.
  window.mailDone = r => {
    say((EN ? { sent: 'Email sent', saved: 'Draft saved in Mail', cancelled: 'Sending cancelled', failed: 'Sending failed', shared: 'Document shared', unshared: 'Sharing cancelled' }
      : { sent: 'Mail envoyé', saved: 'Brouillon enregistré dans Mail', cancelled: 'Envoi annulé', failed: "Échec de l'envoi", shared: 'Document partagé', unshared: 'Partage annulé' })[r] || LG('Envoyer le compte rendu', 'Send the report'));
    setTimeout(() => say(LG('Envoyer le compte rendu', 'Send the report')), 4000);
  };
  let pendingShare = null;
  const shareFile = f => {
    navigator.share({ files: [f.file], title: f.subject, text: f.body }).then(
      () => window.mailDone('shared'),
      e => {
        if (e && e.name === 'NotAllowedError') { pendingShare = f; say(LG('Toucher pour partager le document', 'Tap to share the document')); }
        else window.mailDone('unshared');
      });
  };
  return {
    brief() { load(); const c = compute(); return buildBrief(c, ok(c.sRest) && ok(c.nadir) ? c.sRest - c.nadir : NaN); },
    text() { load(); return reportText(); },
    docx() { load(); return buildDocx(); },
    async send() {
      if (!S.stop) return;
      // Version web : si le partage a été refusé faute de geste récent, ce second toucher partage le document déjà prêt.
      if (pendingShare) { const f = pendingShare; pendingShare = null; shareFile(f); return; }
      say(LG('Préparation du document…', 'Preparing the document…'));
      let bytes;
      try { load(); bytes = await buildDocx(); } catch (e) { say(LG('Échec de la création du document', 'Could not create the document')); return; }
      const m = mailParts();
      if (NATIVE) { native({ action: 'mail', to: String(cfg.mailTo).trim(), subject: m.subject, body: m.body, filename: m.filename, data: base64(bytes) }); return; }
      const type = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
      let file = null;
      try { file = new File([bytes], m.filename, { type }); } catch (e) { }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) { shareFile({ file, subject: m.subject, body: m.body }); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
      a.download = m.filename; a.click();
      say(LG('Document téléchargé', 'Document downloaded'));
    }
  };
})();
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
